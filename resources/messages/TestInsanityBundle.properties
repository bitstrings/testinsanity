testinsanity.form.schemes.section = Test schemes
testinsanity.form.schemes.help = A scheme binds one test class convention to the test method conventions used \
inside it, so unit, integration and end to end tests each keep their own naming.\n\
Schemes are tried top to bottom and the first whose test class pattern matches wins.
testinsanity.form.schemes.name = Name:
testinsanity.form.schemes.class = Test class pattern:
testinsanity.form.schemes.class.help = ${className} = source file name (can appear only once)\n\
(Test|IT) = 'Test' or 'IT'\n\
(Test|) = 'Test' or nothing
testinsanity.form.schemes.methods = Method name patterns for {0}:
testinsanity.form.schemes.methods.none = Method name patterns:
testinsanity.form.schemes.methods.help = Patterns are tried top to bottom and the first that matches wins.\n\
\n\
${subjectName} = subject method name (can appear only once)\n\
(test|spec) = 'test' or 'spec'\n\
(test|) = 'test' or nothing\n\
\n\
Only valid for suffix:\n\
* = any string (can be empty)\n\
+ = any string with at least 1 character
