testinsanity.preset.7.pattern = ${subjectName} *
testinsanity.preset.7.example = <html><head></head><body>\
<pre>\
SubjectClass:<br/>\
<code>\
  fun <b>isDarkColor</b>(): Boolean\
</code>\
<br/><br/>\
<b>--  MATCH  --</b><br/>\
<br/>\
TestClass:<br/>\
<code>\
  <i>@Test</i><br/>\
  fun <b>`isDarkColor returns true when black`</b>() {}<br/>\
  <i>@Test</i><br/>\
  fun <b>`isDarkColor is false when white`</b>() {}<br/>\
</code></pre></body></html>

